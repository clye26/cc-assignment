<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clyde's Toy Corner</title>
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- TOP NAVIGATION BAR -->
    <header class="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo-link">
                <img src="images/nav_logo.png" alt="Clyde's Toy Shop Logo" class="brand-logo-img">
            </a>
        </div>
        
        <div class="search-bar-container">
            <input type="text" id="searchInput" placeholder="Search for a Toy...">
                <button onclick="searchToys()" class="search-icon-btn">
                    <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <div class="nav-right">
            <button class="nav-btn">
                <i class="fa-solid fa-user"></i>
                Login / Signup
            </button>
            <button class="nav-btn cart-btn">
                <i class="fa-solid fa-cart-shopping"></i>
                Cart
            </button>
        </div>
    </header>

    <!-- CAROUSEL BANNER -->
    <section class="carousel-section" id="carouselBanner">
        <div class="carousel-dots">
            <span class="dot active" onclick="changeSlide(0)"></span>
            <span class="dot" onclick="changeSlide(1)"></span>
            <span class="dot" onclick="changeSlide(2)"></span>
        </div>
    </section>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- Search Header -->
        <div class="section-header">
            <h2 id="sectionTitle">Toys</h2>
            <p id="resultsCount" class="results-count"></p>
                <!-- Show All Toys Button -->
                <button id="showAllBtn" class="secondary show-all-inline-btn" style="display: none;" onclick="loadToys()">Show all Toys</button>
        </div>

    <!-- Hidden error banner -->
    <div id="error-banner" class="error-banner" style="display: none;">
        <span id="error-message">Whoops! The toy boy won't open, please check your data or internet connection.</span>
    </div>

    <!-- 4-ITEM GRID LAYOUT -->
    <section>
        <div id="toyList" class="toy-grid">
            Loading toys...
        </div>
    </section>
</main>

    <!-- FOOTER -->
    <footer>
        <img src="images/nav_logo.png" alt="Clyde's Toy Shop Logo" class="brand-logo-img">
        <p>&copy; 2026 Clyde's Toy Shop. All rights reserved.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
