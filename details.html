<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clyde's Toy Corner</title>
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="details-page">

    <!-- TOP NAVIGATION BAR -->
    <header class="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo-link">
                <img src="images/nav_logo.png" alt="Clyde's Toy Shop Logo" class="brand-logo-img">
            </a>
        </div>
        
        <div class="search-bar-container">
            <input type="text" id="searchInput" placeholder="Search for a Toy...">
                <button onclick="searchToys()" class="search-icon-btn">
                    <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <div class="nav-right">
            <button class="nav-btn">
                <i class="fa-solid fa-user"></i>
                Login / Signup
            </button>
            <button class="nav-btn cart-btn">
                <i class="fa-solid fa-cart-shopping"></i>
                Cart
            </button>
        </div>
    </header>

    <!-- DETAILS CONTAINER -->
    <main class="details-container">
        <div id="toyDetails" class="toy-details-wrapper">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 2.5rem; color: #ffa100; margin-bottom: 12px;"></i>
            <h2>Sorting through the Toy Shelf...</h2>
            <p>Hang tight!</p>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        // Automatically fetch details when this page loads
        fetchToyDetails();
    </script>

    <!-- FOOTER -->
    <footer>
        <img src="images/nav_logo.png" alt="Clyde's Toy Shop Logo" class="brand-logo-img">
        <p>&copy; 2026 Clyde's Toy Shop. All rights reserved.</p>
    </footer>
</body>
</html>
