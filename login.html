<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clyde's Toy Shop - Login</title>

    <link rel="stylesheet" href="style.css">
    <!-- Load config.js first -->
    <script src="config.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">

    <div class="login-card">
        <img src="images/nav_logo3.png" alt="Clyde's Toy Shop Logo" class="brand-logo-img">
        <h2 class="login-title">Log in</h2>
        
        <div id="error-msg" class="error-msg-box hidden">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span id="error-text"></span>
        </div>

        <form id="login-form">
            <div class="login-form-group">
                <label class="login-label">Username</label>
                <input type="text" id="username" required class="login-input">
            </div>
            <div class="login-form-group mb-large">
                <label class="login-label">Password</label>
                <input type="password" id="password" required class="login-input">
            </div>
            <button type="submit" class="login-submit-btn">
                Login
            </button>
        </form>
    </div>

    <!-- Load external login script -->
    <script src="login.js"></script>
</body>
</html>
